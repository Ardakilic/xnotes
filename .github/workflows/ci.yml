name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Makefile targets as local development — CI parity with `make`.
      - run: make setup typecheck lint test build zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: .output/*.zip

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make integration
